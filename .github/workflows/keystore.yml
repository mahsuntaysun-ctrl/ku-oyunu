name: Create Keystore
on: workflow_dispatch
jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - run: |
          PASS=$(openssl rand -hex 16)
          echo "$PASS" > password.txt
          keytool -genkeypair -keystore upload-keystore.jks -alias upload -keyalg RSA -keysize 2048 -validity 10000 -storepass "$PASS" -keypass "$PASS" -dname "CN=Kus Oyunu, C=TR"
          base64 -w 0 upload-keystore.jks > keystore.base64.txt
      - uses: actions/upload-artifact@v4
        with:
          name: keystore
          path: |
            upload-keystore.jks
            keystore.base64.txt
            password.txt
