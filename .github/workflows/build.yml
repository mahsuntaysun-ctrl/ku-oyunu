name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter create --platforms=android --project-name kus_oyunu tmp_app
      - run: cp main.dart tmp_app/lib/main.dart
      - run: flutter build apk --release
        working-directory: tmp_app
      - uses: actions/upload-artifact@v4
        with:
          name: kus-oyunu-apk
          path: tmp_app/build/app/outputs/flutter-apk/app-release.apk
